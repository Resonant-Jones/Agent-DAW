[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agentdaw"
version = "0.1.0"
description = "An LLM studio producer: describe a vision, get stems, MIDI and a REAPER project."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.0",
    "scipy>=1.13",
    "pydantic>=2.7",
    "PyYAML>=6.0",
    "httpx>=0.27",
    "jsonschema>=4.21",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
agentdaw = "agentdaw.cli:main"

[tool.setuptools.packages.find]
include = ["agentdaw*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
